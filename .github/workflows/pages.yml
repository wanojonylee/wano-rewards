name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build demo site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build mobile web demo (subpath /wano-rewards)
        working-directory: apps/mobile
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
          EXPO_PUBLIC_API_URL: ''
        run: |
          npm ci
          node -e "const fs=require('fs');const p='app.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.expo.experiments={...(j.expo.experiments||{}),baseUrl:'/wano-rewards'};fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
          npx expo export -p web

      - name: Build admin demo (subpath /wano-rewards/admin)
        working-directory: apps/admin
        run: |
          npm ci
          npx vite build --base=/wano-rewards/admin/

      - name: Assemble static site
        run: |
          mkdir -p site
          cp -r apps/mobile/dist/. site/
          mkdir -p site/admin
          cp -r apps/admin/dist/. site/admin/
          printf 'wano-rewards\n' > site/.nojekyll
          find site -maxdepth 2 -type f | head -30

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
